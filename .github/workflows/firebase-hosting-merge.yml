# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
  # Las paginas /propiedad/*.html se generan desde Google Sheets; al cambiar un precio
  # no hay push, asi que se regeneran y redespliegan automaticamente cada hora.
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerar paginas de propiedades con datos actuales
        env:
          PYTHONIOENCODING: utf-8
        run: python generar_propiedades_v2.py
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INMOBILIARIAICDE }}
          channelId: live
          projectId: inmobiliariaicde
